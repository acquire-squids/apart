name: Clippy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Cargo clippy
        id: cargo_clippy
        run: |
          cargo clippy

      - name: Cargo test
        id: cargo_test
        run: |
          cargo test --no-fail-fast

      - name: Cargo test (optimized)
        id: cargo_test_optimized
        run: |
          cargo test --features "optimized" --no-fail-fast
