name: Clippy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        toolchain:
          - stable

    steps:
      - name: Update toolchain
        id: update_toolchain
        run: |
          rustup update ${{ matrix.toolchain }}
          rustup default ${{ matrix.toolchain }}

      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Cargo clippy
        id: cargo_clippy
        run: |
          cargo clippy

      - name: Cargo test
        id: cargo_test
        run: |
          cargo test --no-fail-fast
